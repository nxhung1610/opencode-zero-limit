name: RelayDock macOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test RelayDockCore and SwiftUI app
        run: swift test --package-path macOS/RelayDock
      - name: Test the bundled OpenCode free-usage plugin
        run: node scripts/test-free-usage-plugin.mjs
      - name: Build macOS app bundle
        run: scripts/build-macos-app.sh
      - name: Validate app bundle
        run: |
          plutil -lint build/RelayDock.app/Contents/Info.plist
          test -x build/RelayDock.app/Contents/MacOS/RelayDock
          test -s build/RelayDock.app/Contents/Resources/AppIcon.icns
          test -x build/RelayDock.app/Contents/Resources/relaydock-launch
          test -x build/RelayDock.app/Contents/Resources/relaydock-edge
          test -s build/RelayDock.app/Contents/Resources/relaydock-free-usage-limit.js
