<svg xmlns="http://www.w3.org/2000/svg" width="660" height="420" viewBox="0 0 660 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCFDFE"/>
      <stop offset="0.55" stop-color="#F4F7FA"/>
      <stop offset="1" stop-color="#E9EFF5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#94A3B8" opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="660" height="420" fill="url(#bg)"/>
  <rect width="660" height="420" fill="url(#dots)"/>
  <ellipse cx="330" cy="210" rx="300" ry="190" fill="url(#glow)"/>
  <rect x="0" y="0" width="660" height="4" fill="#10B981"/>

  <text x="330" y="48" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F172A" letter-spacing="0.2">Proxy routing for OpenCode</text>
  <text x="330" y="66" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#64748B">Rotating, health-checked tunnels with live accounting</text>

  <text x="330" y="188" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#334155">Drag to Applications</text>
  <g stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 268 210 H 382" stroke-dasharray="2 7"/>
    <path d="M 372 200 L 384 210 L 372 220"/>
  </g>

  <line x1="40" y1="356" x2="620" y2="356" stroke="#CBD5E1" stroke-width="1" opacity="0.7"/>
  <text x="330" y="380" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#64748B">First launch: macOS will ask you to approve</text>
  <text x="40" y="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" fill="#94A3B8">macOS 14+ · Apple Silicon</text>
  <text x="620" y="400" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" fill="#94A3B8">github.com/nxhung1610/relaydock</text>
</svg>
