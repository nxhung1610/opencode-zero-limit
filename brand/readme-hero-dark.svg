  <text x="198" y="210" font-family="Avenir Next" font-size="25" font-weight="500" letter-spacing="-0.2" fill="#CBD5E1">Proxy routing for OpenCode.</text>
  <text x="198" y="242" font-family="Avenir Next" font-size="15.5" font-weight="400" fill="#94A3B8">Rotating, health-checked, fail-closed by default.</text>
  <text x="198" y="286" font-family="Menlo" font-size="12.5" fill="#64748B">HTTP · HTTPS · SOCKS4/5 · JavaScript routes</text>

